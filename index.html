<style>

*{box-sizing:border-box}

.body{padding:6px 22px 26px;border-top:1px solid var(--rule)}

.ing li{border-bottom:1px solid var(--rule)}

.tweaks{background:var(--tweak-wash);border-radius:14px;padding:4px 20px 12px;margin-top:22px}

@media print{body{background:#fff}.tools,.toggle,.foot{display:none}.recipe{break-inside:avoid;box-shadow:none}.check::before{display:none}}
</style>
</head>
<body>
<div class="page">
<header class="masthead">
<p class="eyebrow">Our recipe book</p>
<h1>Chef It Up</h1>
<p class="lede">The recipes we actually cook. High in protein, simple ingredients, restaurant quality at home.</p>
<ul class="tally" id="tally"></ul>
</header>
<div class="tools" id="tools">
<div class="search"><label for="q">Search recipes</label><input id="q" type="search" placeholder="Search by name or ingredient" autocomplete="off"></div>
<div class="chips" id="chips" role="group" aria-label="Filter by type"></div>
</div>
<main>
<section class="shelf" data-status="locked" id="locked">
<div class="shelf-head"><h2>Locked in</h2><p><span class="count" id="count-locked"></span> · Exactly how we like them.</p></div>
<div class="list" id="list-locked"></div>
</section>
<section class="shelf" data-status="tweaking" id="tweaking">
<div class="shelf-head"><h2>Still tweaking</h2><p><span class="count" id="count-tweaking"></span> · Good, not final yet.</p></div>
<div class="list" id="list-tweaking"></div>
</section>
</main>
<footer class="foot"><p id="updated"></p><p>Tap ingredients and steps to check them off.</p></footer>
</div>

/* ------------------------------------------------------------------
   Rendering. Nothing below needs editing when adding recipes.
------------------------------------------------------------------- */
function el(tag, attrs, children) {
  const node = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    if (k === "text") node.textContent = attrs[k];
    else node.setAttribute(k, attrs[k]);
  }
  (children || []).forEach(function (c) { if (c) node.appendChild(c); });
  return node;
}
function plain(items) { return el("ul", { class: "plain" }, items.map(function (t) { return el("li", { text: t }); })); }
function checks(tag, cls, items) {
  return el(tag, { class: cls }, items.map(function (t) {
    return el("li", null, [el("button", { type: "button", class: "check", "aria-pressed": "false", text: t })]);
  }));
}
function renderRecipe(r) {
  const amount = r.makes ? "Makes " + r.makes : r.serves ? "Serves " + r.serves : null;
  const facts = [];
  [amount, r.time, r.linkOnly && "Link only"].filter(Boolean).forEach(function (f) { facts.push(el("li", { text: f })); });
  [r.protein, r.calories].filter(Boolean).forEach(function (f) { facts.push(el("li", { class: "nut", text: f })); });

  const photo = el("div", { class: "photo none" }, [el("span", { text: "photo: " + (r.image || "images/" + r.id + ".jpg") })]);
  if (r.image) {
    const img = new Image();
    img.alt = r.title; img.loading = "lazy";
    img.onload = function () { photo.classList.remove("none"); photo.textContent = ""; photo.appendChild(img); if (r.kind) photo.appendChild(el("span", { class: "kind", text: r.kind })); };
    img.src = r.image;
  }
  if (r.kind) photo.appendChild(el("span", { class: "kind", text: r.kind }));

  const summary = el("summary", null, [
    photo,
    el("h3", { text: r.title }),
    el("span", { class: "toggle", "aria-hidden": "true" }),
    r.blurb ? el("p", { class: "blurb", text: r.blurb }) : null,
    facts.length ? el("ul", { class: "facts" }, facts) : null
  ]);

  const body = el("div", { class: "body" });
  if (r.estimated) body.appendChild(el("p", { class: "est", text: "Protein and calories are rough estimates per serving, not tracked numbers." }));
  if (r.linkOnly) {
    body.appendChild(el("p", { class: "est", text: "The full recipe is on the original page for now. Ingredients and steps have not been copied in yet." }));
    if (r.source && r.source.url) body.appendChild(el("a", { class: "linkout", href: r.source.url, rel: "noopener", target: "_blank", text: "Open on " + (r.source.label || "original site") + " →" }));
  }

  const hasIng = r.ingredients && r.ingredients.length, hasSteps = r.steps && r.steps.length;
  if (hasIng || hasSteps) {
    const ing = el("div", { class: "ing" });
    if (hasIng) {
      ing.appendChild(el("h4", { text: "Ingredients" }));
      r.ingredients.forEach(function (g) {
        if (typeof g === "string") { ing.appendChild(checks("ul", "", [g])); return; }
        if (g.group) ing.appendChild(el("h5", { text: g.group }));
        ing.appendChild(checks("ul", "", g.items));
      });
    }
    const st = el("div", { class: "method" });
    if (hasSteps) { st.appendChild(el("h4", { text: "Method" })); st.appendChild(checks("ol", "steps", r.steps)); }
    body.appendChild(el("div", { class: "cols" }, [ing, st]));
  }

  const showTweaks = r.tweaks && r.tweaks.length && r.status === "tweaking";
  if (r.notes && r.notes.length) {
    body.appendChild(el("div", { class: "extras" }, [el("div", null, [el("h4", { text: "Notes" }), plain(r.notes)])]));
  }
  if (showTweaks) body.appendChild(el("div", { class: "tweaks" }, [el("h4", { text: "Tweaks to try next" }), plain(r.tweaks)]));
  if (r.source && r.source.url && !r.linkOnly) {
    const p = el("p", { class: "source", text: "Original recipe: " });
    p.appendChild(el("a", { href: r.source.url, rel: "noopener", target: "_blank", text: r.source.label || r.source.url }));
    body.appendChild(p);
  }

  const card = el("details", { class: "recipe", id: r.id }, [summary, body]);
  card.dataset.kind = r.kind || "";
  card.dataset.search = [r.title, r.kind || "", r.blurb || "",
    (r.ingredients || []).map(function (g) { return typeof g === "string" ? g : g.items.join(" "); }).join(" ")
  ].join(" ").toLowerCase();
  return card;
}

const EMPTY = {
  locked: "Nothing locked in yet. A recipe moves here once we stop changing it.",
  tweaking: "Nothing in progress. Everything we cook is locked in."
};
let kindFilter = "All";
const KINDS = ["All"].concat(Array.from(new Set(RECIPES.map(function (r) { return r.kind; }).filter(Boolean))).sort());

function render() {
  const query = document.getElementById("q").value;
  const q = query.trim().toLowerCase();
  ["locked", "tweaking"].forEach(function (status) {
    const target = document.getElementById("list-" + status);
    const all = RECIPES.filter(function (r) { return r.status === status; })
      .sort(function (a, b) { return a.title.localeCompare(b.title); });
    target.textContent = "";
    let shown = 0;
    all.forEach(function (r) {
      if (kindFilter !== "All" && r.kind !== kindFilter) return;
      const card = renderRecipe(r);
      if (q && card.dataset.search.indexOf(q) === -1) return;
      target.appendChild(card);
      shown++;
    });
    const filtered = q || kindFilter !== "All";
    if (!shown) target.appendChild(el("p", { class: "empty", text: filtered && all.length ? "No matches here" + (q ? " for “" + query.trim() + "”" : "") + "." : EMPTY[status] }));
    document.getElementById("count-" + status).textContent = all.length === 1 ? "1 recipe" : all.length + " recipes";
  });
}

function renderChips() {
  const wrap = document.getElementById("chips");
  wrap.textContent = "";
  KINDS.forEach(function (k) {
    const b = el("button", { type: "button", class: "chip", "aria-pressed": String(k === kindFilter), text: k });
    b.addEventListener("click", function () { kindFilter = k; renderChips(); render(); });
    wrap.appendChild(b);
  });
}

function renderTally() {
  const n = function (s) { return RECIPES.filter(function (r) { return r.status === s; }).length; };
  const t = document.getElementById("tally");
  [[RECIPES.length, "recipes"], [n("locked"), "locked in"], [n("tweaking"), "still tweaking"]].forEach(function (p) {
    const li = el("li"); li.appendChild(el("b", { text: String(p[0]) })); li.appendChild(document.createTextNode(p[1])); t.appendChild(li);
  });
}

function scrollToEl(node) {
  const y = node.getBoundingClientRect().top + window.scrollY - 110;
  window.scrollTo({ top: y, behavior: "smooth" });
}

function openFromHash() {
  const id = decodeURIComponent(location.hash.slice(1));
  if (!id) return;
  const target = document.getElementById(id);
  if (target && target.tagName === "DETAILS") { target.open = true; scrollToEl(target); }
}

document.addEventListener("click", function (e) {
  const c = e.target.closest(".check");
  if (c) c.setAttribute("aria-pressed", c.getAttribute("aria-pressed") === "true" ? "false" : "true");
});
document.addEventListener("toggle", function (e) {
  if (e.target.matches && e.target.matches("details.recipe") && e.target.open) {
    history.replaceState(null, "", "#" + e.target.id);
    setTimeout(function () { const r = e.target.getBoundingClientRect(); if (r.top < 90 || r.top > window.innerHeight * 0.5) scrollToEl(e.target); }, 30);
  }
}, true);
const tools = document.getElementById("tools");
window.addEventListener("scroll", function () { tools.classList.toggle("stuck", tools.getBoundingClientRect().top <= 0); }, { passive: true });
document.getElementById("q").addEventListener("input", render);
window.addEventListener("hashchange", openFromHash);
window.addEventListener("beforeprint", function () {
  document.querySelectorAll("details.recipe").forEach(function (d) { d.open = true; });
});
document.getElementById("updated").textContent = "Last updated " + UPDATED + ".";
renderTally();
renderChips();
render();
openFromHash();
</script>
